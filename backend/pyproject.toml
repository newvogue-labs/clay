[project]
name = "clay-backend"
version = "0.1.0"
description = "Local control plane for Clay"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic>=1.14,<2.0",
  "apscheduler>=3.10,<4.0",
  "ccxt==4.5.60",
  "fastapi>=0.115,<0.116",
  "icontract>=2.7.3,<3.0",
  "notion-client>=3.1.0,<4.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "ruamel-yaml>=0.18,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
  "asgi-lifespan>=2.0,<3.0",
  "httpx>=0.27,<0.28",
  "hypothesis>=6.156.6,<7.0",
  "pre-commit-hooks==6.0.0",
  "pre-commit==4.6.0",
  "pyright==1.1.411",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff==0.15.16",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clay"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "slow: slow tests not run in CI",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Файлы миграций генерируются и исторически заморожены — порядок импортов в них не выравниваем.
"alembic/versions/*" = ["I001"]
# alembic/env.py импортит clay-модули ПОСЛЕ load_dotenv(), чтобы IngestionSettings
# видел .env. Не-инвазивно: глушим E402 и F401 (side-effect imports для metadata)
# точечно, не переписывая env.py. Порядок импортов семантически значим.
"alembic/env.py" = ["E402", "F401", "I001"]
# clay/api/main.py: configure_clay_logging() должен выполниться ДО импорта
# lifespan (clay.bootstrap печатает стартовый лог "audit journal path" на import,
# D-45). Семантически значимый порядок — глушим E402 точечно.
"src/clay/api/main.py" = ["E402"]# tests/conftest.py: side-effect imports (модели регистрируются в Base.metadata),
# E402 по design (DB URL setup precedes clay imports).
# Порядок импортов семантически значим.
"tests/conftest.py" = ["E402", "F401", "I001"]
# seed_demo_signal_data.py: sys.path.insert() между блоками импортов,
# порядок sqlalchemy/clay-импортов семантически значим.
"scripts/seed_demo_signal_data.py" = ["E402", "I001"]

[tool.ruff.format]

# Pyright config lives in backend/pyrightconfig.json (standalone config FULLY
# overrides [tool.pyright] — pyright does NOT merge them). Single source of
# truth: include = ["src","tests"]. Do NOT re-add a [tool.pyright] table here
# (it would be silently ignored — this trap cost us a red-main scare).
