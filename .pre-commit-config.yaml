# D-22: all hooks use repo: local + language: system — pre-commit never builds Python envs.
# Tool versions pinned in backend/pyproject.toml [dependency-groups] dev.
minimum_pre_commit_version: "3.5.0"
repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff (lint)
        entry: uv --project backend run ruff check --fix
        language: system
        files: ^backend/
        types: [python]
      - id: ruff-format
        name: ruff (format)
        entry: uv --project backend run ruff format
        language: system
        files: ^backend/
        types: [python]
      - id: check-yaml
        name: check-yaml
        entry: uv --project backend run check-yaml --unsafe
        language: system
        types: [yaml]
      - id: check-toml
        name: check-toml
        entry: uv --project backend run check-toml
        language: system
        types: [toml]
      - id: check-merge-conflict
        name: check-merge-conflict
        entry: uv --project backend run check-merge-conflict
        language: system
      - id: check-added-large-files
        name: check-added-large-files
        entry: uv --project backend run check-added-large-files
        language: system
